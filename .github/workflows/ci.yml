name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jj: ["0.41.0", "0.42.0", "0.43.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jj ${{ matrix.jj }}
        run: |
          set -euo pipefail
          url="https://github.com/jj-vcs/jj/releases/download/v${{ matrix.jj }}/jj-v${{ matrix.jj }}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error "$url" -o /tmp/jj.tar.gz
          mkdir -p /tmp/jj-bin
          tar -xzf /tmp/jj.tar.gz -C /tmp/jj-bin
          echo /tmp/jj-bin >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          node --version
          jj --version

      - name: Node harness (surface probes, window sync)
        run: npm test

      - name: Eval runner self-tests (stubbed, no credentials)
        run: |
          sh tests/evals.test.sh
          sh tests/eval-cases.test.sh
          sh tests/release-evals.test.sh

      - name: Catalog gates
        run: |
          sh .agents/skills/maintaining-jj-catalog/scripts/test-capture-jj-surface.sh
          sh .agents/skills/maintaining-jj-catalog/scripts/check-manifest-sync.sh
